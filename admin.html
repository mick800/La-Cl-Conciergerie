
<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administration | La Clé Conciergerie</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet"
>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Poppins, sans-serif;
    background: #f5f6f8;
    color: #222;
}

/* ==============================
   HEADER
============================== */

header {
    background: #111;
    color: #fff;
    padding: 20px;
}

.header-inner {
    max-width: 1100px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

header h1 {
    font-size: 20px;
    margin: 0;
}

/* ==============================
   CONTAINER
============================== */

.container {
    max-width: 1100px;
    margin: 40px auto;
    padding: 0 20px;
}

/* ==============================
   LOGIN
============================== */

.login-box,
.admin-box {
    background: #fff;
    border-radius: 20px;
    padding: 35px;
    box-shadow: 0 10px 35px rgba(0,0,0,.07);
}

.login-box {
    max-width: 500px;
    margin: 80px auto;
}

h2 {
    margin-top: 0;
}

.field {
    margin-bottom: 18px;
}

label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 9px;
    font-family: inherit;
    font-size: 15px;
}

input:focus {
    outline: none;
    border-color: #b8944d;
    box-shadow: 0 0 0 3px rgba(184,148,77,.12);
}

/* ==============================
   BUTTONS
============================== */

button {
    font-family: inherit;
    cursor: pointer;
}

.btn {
    border: none;
    border-radius: 9px;
    padding: 12px 20px;
    font-weight: 600;
}

.btn-login {
    width: 100%;
    background: #b8944d;
    color: white;
}

.btn-login:hover {
    background: #a48242;
}

.btn-login:disabled {
    opacity: .6;
    cursor: wait;
}

.btn-logout {
    background: #fff;
    color: #111;
}

.btn-logout:hover {
    background: #eee;
}

/* ==============================
   MESSAGES
============================== */

.message {
    display: none;
    padding: 13px;
    border-radius: 9px;
    margin-top: 15px;
    font-size: 14px;
}

.message.error {
    display: block;
    background: #ffe9e9;
    color: #a00000;
}

.message.success {
    display: block;
    background: #e8f7ed;
    color: #147333;
}

/* ==============================
   ADMIN
============================== */

#adminPanel {
    display: none;
}

.admin-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
    flex-wrap: wrap;
}

/* ==============================
   STATS
============================== */

.stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-bottom: 30px;
}

.stat-box {
    background: #fff;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,.05);
}

.stat-box span {
    font-size: 14px;
    color: #777;
}

.stat-box strong {
    display: block;
    font-size: 30px;
    margin-top: 5px;
}

/* ==============================
   REVIEWS
============================== */

.review-list {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.review {
    border: 1px solid #e5e5e5;
    border-radius: 15px;
    padding: 25px;
    background: #fff;
}

.review-stars {
    font-size: 22px;
    letter-spacing: 3px;
    margin-bottom: 10px;
}

.review-name {
    font-weight: 700;
    font-size: 17px;
}

.review-text {
    margin: 15px 0;
    line-height: 1.7;
    color: #555;
    white-space: pre-wrap;
}

.review-date {
    font-size: 12px;
    color: #888;
    margin-bottom: 20px;
}

/* ==============================
   ACTIONS
============================== */

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.btn-accept {
    background: #198754;
    color: white;
}

.btn-accept:hover {
    background: #157347;
}

.btn-reject {
    background: #dc3545;
    color: white;
}

.btn-reject:hover {
    background: #bb2d3b;
}

/* ==============================
   EMPTY / LOADING
============================== */

.empty {
    padding: 30px;
    text-align: center;
    color: #777;
}

.loading {
    padding: 30px;
    text-align: center;
    color: #777;
}

/* ==============================
   MOBILE
============================== */

@media(max-width:650px) {

    .stats {
        grid-template-columns: 1fr;
    }

    .login-box,
    .admin-box {
        padding: 25px;
    }

    header h1 {
        font-size: 16px;
    }

    .header-inner {
        align-items: flex-start;
    }

}

</style>

</head>

<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

<div class="header-inner">

<h1>
La Clé Conciergerie — Administration
</h1>

<button
id="logoutButton"
class="btn btn-logout"
style="display:none;"
>
Déconnexion
</button>

</div>

</header>


<!-- =====================================================
     CONNEXION
===================================================== -->

<div
id="loginPanel"
class="container"
>

<div class="login-box">

<h2>
Connexion administrateur
</h2>

<p>
Connectez-vous pour gérer les avis clients.
</p>


<form id="loginForm">

<div class="field">

<label for="email">
Adresse e-mail
</label>

<input
type="email"
id="email"
required
autocomplete="username"
placeholder="Votre adresse e-mail"
>

</div>


<div class="field">

<label for="password">
Mot de passe
</label>

<input
type="password"
id="password"
required
autocomplete="current-password"
placeholder="Votre mot de passe"
>

</div>


<button
type="submit"
class="btn btn-login"
id="loginButton"
>
Se connecter
</button>


<div
id="loginMessage"
class="message"
></div>

</form>

</div>

</div>


<!-- =====================================================
     ADMINISTRATION
===================================================== -->

<div
id="adminPanel"
class="container"
>

<div class="admin-top">

<div>

<h2>
Gestion des avis
</h2>

<p>
Acceptez ou refusez les avis avant leur publication.
</p>

</div>

</div>


<!-- STATISTIQUES -->

<div class="stats">

<div class="stat-box">

<span>
Avis en attente
</span>

<strong id="pendingCount">
0
</strong>

</div>


<div class="stat-box">

<span>
Avis publiés
</span>

<strong id="approvedCount">
0
</strong>

</div>

</div>


<!-- LISTE DES AVIS -->

<div class="admin-box">

<div
id="reviewList"
class="review-list"
>

<div class="loading">
Chargement des avis...
</div>

</div>

</div>

</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

/* =====================================================
   IMPORT FIREBASE
===================================================== */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getDatabase,
    ref,
    onValue,
    get,
    remove,
    set
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* =====================================================
   CONFIGURATION FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyC1GfrCkZrrvAnIo-yiJP1gyIxoWFfW9Cg",

    authDomain:
    "lacleconciergerie-a3e94.firebaseapp.com",

    databaseURL:
    "https://lacleconciergerie-a3e94-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
    "lacleconciergerie-a3e94",

    storageBucket:
    "lacleconciergerie-a3e94.firebasestorage.app",

    messagingSenderId:
    "190906565909",

    appId:
    "1:190906565909:web:25e073e959dba471c9951c",

    measurementId:
    "G-TXWJ6XNN0D"

};


/* =====================================================
   INITIALISATION
===================================================== */

const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

const auth =
getAuth(app);


/* =====================================================
   ELEMENTS
===================================================== */

const loginPanel =
document.getElementById("loginPanel");

const adminPanel =
document.getElementById("adminPanel");

const loginForm =
document.getElementById("loginForm");

const loginButton =
document.getElementById("loginButton");

const loginMessage =
document.getElementById("loginMessage");

const logoutButton =
document.getElementById("logoutButton");

const reviewList =
document.getElementById("reviewList");

const pendingCount =
document.getElementById("pendingCount");

const approvedCount =
document.getElementById("approvedCount");


/* =====================================================
   CONNEXION
===================================================== */

loginForm.addEventListener(
"submit",
async event => {

    event.preventDefault();

    const email =
    document
    .getElementById("email")
    .value
    .trim();

    const password =
    document
    .getElementById("password")
    .value;


    loginButton.disabled = true;

    loginButton.textContent =
    "Connexion...";


    hideMessage(loginMessage);


    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }

    catch(error) {

        console.error(
            "Erreur Firebase Authentication :",
            error
        );


        let message =
        "Adresse e-mail ou mot de passe incorrect.";


        if (
            error.code ===
            "auth/invalid-credential"
        ) {

            message =
            "Adresse e-mail ou mot de passe incorrect.";

        }

        else if (
            error.code ===
            "auth/user-not-found"
        ) {

            message =
            "Aucun compte administrateur ne correspond à cette adresse.";

        }

        else if (
            error.code ===
            "auth/wrong-password"
        ) {

            message =
            "Le mot de passe est incorrect.";

        }

        else if (
            error.code ===
            "auth/invalid-email"
        ) {

            message =
            "L'adresse e-mail n'est pas valide.";

        }

        else if (
            error.code ===
            "auth/too-many-requests"
        ) {

            message =
            "Trop de tentatives. Réessayez plus tard.";

        }

        else if (
            error.code ===
            "auth/network-request-failed"
        ) {

            message =
            "Problème de connexion Internet.";

        }


        showMessage(
            loginMessage,
            message,
            "error"
        );

    }


    loginButton.disabled = false;

    loginButton.textContent =
    "Se connecter";

});


/* =====================================================
   ETAT DE CONNEXION
===================================================== */

onAuthStateChanged(
auth,
user => {

    if (user) {

        loginPanel.style.display =
        "none";

        adminPanel.style.display =
        "block";

        logoutButton.style.display =
        "block";

        loadReviews();

    }

    else {

        loginPanel.style.display =
        "block";

        adminPanel.style.display =
        "none";

        logoutButton.style.display =
        "none";

    }

});


/* =====================================================
   DECONNEXION
===================================================== */

logoutButton.addEventListener(
"click",
async () => {

    try {

        await signOut(auth);

    }

    catch(error) {

        console.error(
            "Erreur déconnexion :",
            error
        );

    }

});


/* =====================================================
   CHARGER LES AVIS
===================================================== */

function loadReviews() {


    const pendingRef =
    ref(
        db,
        "reviews/pending"
    );


    const approvedRef =
    ref(
        db,
        "reviews/approved"
    );


    /* ==========================
       AVIS EN ATTENTE
    ========================== */

    onValue(
        pendingRef,

        snapshot => {

            const data =
            snapshot.val();


            if (!data) {

                pendingCount.textContent =
                "0";

                reviewList.innerHTML = `

                    <div class="empty">
                        Aucun avis en attente.
                    </div>

                `;

                return;

            }


            const reviews =
            Object.entries(data)

            .map(
                ([id, review]) => ({
                    id,
                    ...review
                })
            )

            .sort(
                (a, b) =>
                Number(a.createdAt || 0) -
                Number(b.createdAt || 0)
            );


            pendingCount.textContent =
            reviews.length;


            reviewList.innerHTML =
            "";


            reviews.forEach(
                review => {

                    reviewList.appendChild(
                        createReviewElement(review)
                    );

                }
            );

        },

        error => {

            console.error(
                "Erreur lecture avis :",
                error
            );


            reviewList.innerHTML = `

                <div class="empty">
                    Impossible de charger les avis.
                </div>

            `;

        }
    );


    /* ==========================
       AVIS APPROUVÉS
    ========================== */

    onValue(
        approvedRef,

        snapshot => {

            const data =
            snapshot.val();


            approvedCount.textContent =
            data
            ? Object.keys(data).length
            : "0";

        },

        error => {

            console.error(
                "Erreur lecture avis approuvés :",
                error
            );

        }
    );

}


/* =====================================================
   CREER UNE CARTE AVIS
===================================================== */

function createReviewElement(review) {


    const article =
    document.createElement("article");

    article.className =
    "review";


    /* NOTE */

    let rating =
    Number(review.rating);


    if (!Number.isFinite(rating)) {

        rating = 5;

    }


    rating =
    Math.max(
        1,
        Math.min(
            5,
            Math.round(rating)
        )
    );


    const stars =
    "★".repeat(rating) +
    "☆".repeat(5 - rating);


    /* DATE */

    const date =
    review.createdAt

    ? new Date(
        Number(review.createdAt)
      ).toLocaleString(
        "fr-FR"
      )

    : "Date inconnue";


    /* ETOILES */

    const starsDiv =
    document.createElement("div");

    starsDiv.className =
    "review-stars";

    starsDiv.textContent =
    stars;


    /* NOM */

    const nameDiv =
    document.createElement("div");

    nameDiv.className =
    "review-name";

    nameDiv.textContent =
    review.name ||
    "Client";


    /* TEXTE */

    const textDiv =
    document.createElement("div");

    textDiv.className =
    "review-text";

    textDiv.textContent =
    review.text ||
    "";


    /* DATE */

    const dateDiv =
    document.createElement("div");

    dateDiv.className =
    "review-date";

    dateDiv.textContent =
    "Envoyé le " +
    date;


    /* ACTIONS */

    const actions =
    document.createElement("div");

    actions.className =
    "actions";


    /* ACCEPTER */

    const acceptButton =
    document.createElement("button");

    acceptButton.className =
    "btn btn-accept";

    acceptButton.textContent =
    "✓ Accepter";


    /* REFUSER */

    const rejectButton =
    document.createElement("button");

    rejectButton.className =
    "btn btn-reject";

    rejectButton.textContent =
    "✕ Refuser";


    acceptButton.addEventListener(
        "click",
        () =>
        acceptReview(review.id)
    );


    rejectButton.addEventListener(
        "click",
        () =>
        rejectReview(review.id)
    );


    actions.appendChild(
        acceptButton
    );

    actions.appendChild(
        rejectButton
    );


    article.appendChild(
        starsDiv
    );

    article.appendChild(
        nameDiv
    );

    article.appendChild(
        textDiv
    );

    article.appendChild(
        dateDiv
    );

    article.appendChild(
        actions
    );


    return article;

}


/* =====================================================
   ACCEPTER UN AVIS
===================================================== */

async function acceptReview(id) {


    if (!auth.currentUser) {

        alert(
            "Vous devez être connecté."
        );

        return;

    }


    const pendingReviewRef =
    ref(
        db,
        "reviews/pending/" + id
    );


    try {

        const snapshot =
        await get(
            pendingReviewRef
        );


        if (!snapshot.exists()) {

            alert(
                "Cet avis n'existe plus."
            );

            return;

        }


        const review =
        snapshot.val();


        const approvedReviewRef =
        ref(
            db,
            "reviews/approved/" + id
        );


        await set(
            approvedReviewRef,
            {

                name:
                review.name ||
                "Client",

                rating:
                review.rating ||
                5,

                text:
                review.text ||
                "",

                createdAt:
                review.createdAt ||
                Date.now(),

                status:
                "approved"

            }
        );


        await remove(
            pendingReviewRef
        );


    }

    catch(error) {

        console.error(
            "Erreur acceptation :",
            error
        );


        alert(
            "Impossible d'accepter cet avis."
        );

    }

}


/* =====================================================
   REFUSER UN AVIS
===================================================== */

async function rejectReview(id) {


    if (!auth.currentUser) {

        alert(
            "Vous devez être connecté."
        );

        return;

    }


    const confirmation =
    confirm(
        "Voulez-vous vraiment refuser cet avis ?"
    );


    if (!confirmation) {

        return;

    }


    const pendingReviewRef =
    ref(
        db,
        "reviews/pending/" + id
    );


    try {

        await remove(
            pendingReviewRef
        );

    }

    catch(error) {

        console.error(
            "Erreur refus :",
            error
        );


        alert(
            "Impossible de refuser cet avis."
        );

    }

}


/* =====================================================
   MESSAGES
===================================================== */

function showMessage(
    element,
    message,
    type
) {

    element.textContent =
    message;

    element.className =
    "message " + type;

}


function hideMessage(element) {

    element.textContent =
    "";

    element.className =
    "message";

}

</script>

</body>
</html>
