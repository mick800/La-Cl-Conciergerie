<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Administration | La Clé Conciergerie</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet"
>

<style>

* {
box-sizing:border-box;
}

body {
margin:0;
font-family:Poppins,sans-serif;
background:#f5f6f8;
color:#222;
}

header {
background:#111;
color:#fff;
padding:20px;
}

.header-inner {
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
}

header h1 {
font-size:20px;
margin:0;
}

.container {
max-width:1100px;
margin:40px auto;
padding:0 20px;
}

.login-box,
.admin-box {
background:#fff;
border-radius:20px;
padding:35px;
box-shadow:0 10px 35px rgba(0,0,0,.07);
}

.login-box {
max-width:500px;
margin:80px auto;
}

h2 {
margin-top:0;
}

.field {
margin-bottom:18px;
}

label {
display:block;
font-size:14px;
font-weight:600;
margin-bottom:7px;
}

input {
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:9px;
font-family:inherit;
font-size:15px;
}

button {
font-family:inherit;
cursor:pointer;
}

.btn {
border:none;
border-radius:9px;
padding:12px 20px;
font-weight:600;
}

.btn-login {
width:100%;
background:#b8944d;
color:white;
}

.btn-logout {
background:#fff;
color:#111;
}

.message {
display:none;
padding:13px;
border-radius:9px;
margin-top:15px;
font-size:14px;
}

.message.error {
display:block;
background:#ffe9e9;
color:#a00000;
}

.message.success {
display:block;
background:#e8f7ed;
color:#147333;
}

#adminPanel {
display:none;
}

.admin-top {
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
margin-bottom:30px;
flex-wrap:wrap;
}

.stats {
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
margin-bottom:30px;
}

.stat-box {
background:#fff;
padding:25px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.stat-box strong {
display:block;
font-size:30px;
}

.review-list {
display:flex;
flex-direction:column;
gap:20px;
}

.review {
border:1px solid #e5e5e5;
border-radius:15px;
padding:25px;
background:#fff;
}

.review-stars {
font-size:22px;
letter-spacing:3px;
margin-bottom:10px;
}

.review-name {
font-weight:700;
font-size:17px;
}

.review-text {
margin:15px 0;
line-height:1.7;
color:#555;
white-space:pre-wrap;
}

.review-date {
font-size:12px;
color:#888;
margin-bottom:20px;
}

.actions {
display:flex;
gap:10px;
flex-wrap:wrap;
}

.btn-accept {
background:#198754;
color:white;
}

.btn-reject {
background:#dc3545;
color:white;
}

.empty {
padding:30px;
text-align:center;
color:#777;
}

.loading {
padding:30px;
text-align:center;
}

@media(max-width:650px) {

.stats {
grid-template-columns:1fr;
}

.login-box,
.admin-box {
padding:25px;
}

}

</style>

</head>

<body>


<header>

<div class="header-inner">

<h1>
La Clé Conciergerie — Administration
</h1>

<button
id="logoutButton"
class="btn btn-logout"
style="display:none;"
>
Déconnexion
</button>

</div>

</header>


<!-- =====================================================
     CONNEXION
===================================================== -->

<div
id="loginPanel"
class="container"
>

<div class="login-box">

<h2>
Connexion administrateur
</h2>

<p>
Connectez-vous pour gérer les avis clients.
</p>


<form id="loginForm">

<div class="field">

<label for="email">
Adresse e-mail
</label>

<input
type="email"
id="email"
required
autocomplete="username"
>

</div>


<div class="field">

<label for="password">
Mot de passe
</label>

<input
type="password"
id="password"
required
autocomplete="current-password"
>

</div>


<button
type="submit"
class="btn btn-login"
id="loginButton"
>
Se connecter
</button>


<div
id="loginMessage"
class="message"
></div>

</form>

</div>

</div>


<!-- =====================================================
     ADMINISTRATION
===================================================== -->

<div
id="adminPanel"
class="container"
>

<div class="admin-top">

<div>

<h2>
Avis en attente
</h2>

<p>
Acceptez ou refusez les avis avant leur publication.
</p>

</div>

</div>


<div class="stats">

<div class="stat-box">

<span>
Avis en attente
</span>

<strong id="pendingCount">
0
</strong>

</div>


<div class="stat-box">

<span>
Avis publiés
</span>

<strong id="approvedCount">
0
</strong>

</div>

</div>


<div class="admin-box">

<div
id="reviewList"
class="review-list"
>

<div class="loading">
Chargement des avis...
</div>

</div>

</div>

</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getDatabase,
ref,
onValue,
get,
remove,
set
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* =====================================================
   CONFIGURATION FIREBASE
===================================================== */

const firebaseConfig = {

apiKey: "TON_API_KEY",

authDomain:
"lacleconciergerie-a3e94.firebaseapp.com",

databaseURL:
"https://lacleconciergerie-a3e94-default-rtdb.europe-west1.firebasedatabase.app",

projectId:
"lacleconciergerie-a3e94",

storageBucket:
"TON_STORAGE_BUCKET",

messagingSenderId:
"TON_MESSAGING_SENDER_ID",

appId:
"TON_APP_ID"

};


const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

const auth =
getAuth(app);


/* =====================================================
   ELEMENTS
===================================================== */

const loginPanel =
document.getElementById("loginPanel");

const adminPanel =
document.getElementById("adminPanel");

const loginForm =
document.getElementById("loginForm");

const loginButton =
document.getElementById("loginButton");

const loginMessage =
document.getElementById("loginMessage");

const logoutButton =
document.getElementById("logoutButton");

const reviewList =
document.getElementById("reviewList");

const pendingCount =
document.getElementById("pendingCount");

const approvedCount =
document.getElementById("approvedCount");


/* =====================================================
   CONNEXION
===================================================== */

loginForm.addEventListener(
"submit",
async event => {

event.preventDefault();

const email =
document.getElementById("email")
.value
.trim();

const password =
document.getElementById("password")
.value;


loginButton.disabled = true;

loginButton.textContent =
"Connexion...";


try {

await signInWithEmailAndPassword(
auth,
email,
password
);

showMessage(
loginMessage,
"",
"success"
);

}
catch(error) {

console.error(error);

showMessage(
loginMessage,
"Adresse e-mail ou mot de passe incorrect.",
"error"
);

}


loginButton.disabled = false;

loginButton.textContent =
"Se connecter";

});


/* =====================================================
   ETAT DE CONNEXION
===================================================== */

onAuthStateChanged(
auth,
user => {

if (user) {

loginPanel.style.display =
"none";

adminPanel.style.display =
"block";

logoutButton.style.display =
"block";

loadReviews();

}
else {

loginPanel.style.display =
"block";

adminPanel.style.display =
"none";

logoutButton.style.display =
"none";

}

});


/* =====================================================
   DECONNEXION
===================================================== */

logoutButton.addEventListener(
"click",
async () => {

await signOut(auth);

});


/* =====================================================
   CHARGER LES AVIS
===================================================== */

function loadReviews() {

const pendingRef =
ref(db, "reviews/pending");


const approvedRef =
ref(db, "reviews/approved");


onValue(
pendingRef,
snapshot => {

const data =
snapshot.val();

if (!data) {

pendingCount.textContent =
"0";

reviewList.innerHTML = `

<div class="empty">
Aucun avis en attente.
</div>

`;

return;

}


const reviews =
Object.entries(data)
.map(([id, review]) => ({
id,
...review
}))
.sort(
(a,b) =>
Number(a.createdAt || 0) -
Number(b.createdAt || 0)
);


pendingCount.textContent =
reviews.length;


reviewList.innerHTML = "";


reviews.forEach(review => {

reviewList.appendChild(
createReviewElement(review)
);

});

},
error => {

console.error(error);

reviewList.innerHTML = `

<div class="empty">
Impossible de charger les avis.
</div>

`;

});


onValue(
approvedRef,
snapshot => {

const data =
snapshot.val();

approvedCount.textContent =
data
? Object.keys(data).length
: "0";

});

}


/* =====================================================
   CREER UNE CARTE AVIS
===================================================== */

function createReviewElement(review) {

const article =
document.createElement("article");

article.className =
"review";


let rating =
Number(review.rating);

if (!Number.isFinite(rating)) {
rating = 5;
}

rating =
Math.max(
1,
Math.min(
5,
Math.round(rating)
)
);


const stars =
"★".repeat(rating) +
"☆".repeat(5 - rating);


const date =
review.createdAt
? new Date(
Number(review.createdAt)
).toLocaleString("fr-FR")
: "Date inconnue";


const starsDiv =
document.createElement("div");

starsDiv.className =
"review-stars";

starsDiv.textContent =
stars;


const nameDiv =
document.createElement("div");

nameDiv.className =
"review-name";

nameDiv.textContent =
review.name || "Client";


const textDiv =
document.createElement("div");

textDiv.className =
"review-text";

textDiv.textContent =
review.text || "";


const dateDiv =
document.createElement("div");

dateDiv.className =
"review-date";

dateDiv.textContent =
"Envoyé le " + date;


const actions =
document.createElement("div");

actions.className =
"actions";


const acceptButton =
document.createElement("button");

acceptButton.className =
"btn btn-accept";

acceptButton.textContent =
"✓ Accepter";


const rejectButton =
document.createElement("button");

rejectButton.className =
"btn btn-reject";

rejectButton.textContent =
"✕ Refuser";


acceptButton.addEventListener(
"click",
() => acceptReview(review.id)
);


rejectButton.addEventListener(
"click",
() => rejectReview(review.id)
);


actions.appendChild(
acceptButton
);

actions.appendChild(
rejectButton
);


article.appendChild(
starsDiv
);

article.appendChild(
nameDiv
);

article.appendChild(
textDiv
);

article.appendChild(
dateDiv
);

article.appendChild(
actions
);


return article;

}


/* =====================================================
   ACCEPTER
===================================================== */

async function acceptReview(id) {

if (!auth.currentUser) {
return;
}


const pendingReviewRef =
ref(
db,
"reviews/pending/" + id
);


try {

const snapshot =
await get(
pendingReviewRef
);


if (!snapshot.exists()) {
return;
}


const review =
snapshot.val();


const approvedReviewRef =
ref(
db,
"reviews/approved/" + id
);


await set(
approvedReviewRef,
{

name: review.name || "Client",

rating: review.rating || 5,

text: review.text || "",

createdAt:
review.createdAt ||
Date.now(),

status:
"approved"

}
);


await remove(
pendingReviewRef
);


}
catch(error) {

console.error(
"Erreur acceptation :",
error
);

alert(
"Impossible d'accepter cet avis."
);

}

}


/* =====================================================
   REFUSER
===================================================== */

async function rejectReview(id) {

if (!auth.currentUser) {
return;
}


const confirmation =
confirm(
"Voulez-vous vraiment refuser cet avis ?"
);


if (!confirmation) {
return;
}


const pendingReviewRef =
ref(
db,
"reviews/pending/" + id
);


try {

await remove(
pendingReviewRef
);

}
catch(error) {

console.error(
"Erreur refus :",
error
);

alert(
"Impossible de refuser cet avis."
);

}

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
element,
message,
type
) {

element.textContent =
message;

element.className =
"message " + type;

}

</script>

</body>
</html>
