name: Update commission rate

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-rate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply 19 percent changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('18 %', '19 %')
          s = s.replace('18%', '19%')
          s = s.replace('0.18', '0.19')
          s = s.replace('value="0.18"', 'value="0.19"')
          s = s.replace('Gestion complète — 18 %', 'Gestion complète — 19 %')
          s = s.replace('formule Prestige à 18 %', 'formule Prestige à 19 %')
          s = s.replace('formule Prestige est proposée à 18 %', 'formule Prestige est proposée à 19 %')
          old = '''Oui. Selon la formule choisie, nous pouvons prendre en charge
le nettoyage du logement après les séjours ainsi que la préparation
et la mise en place du linge.'''
          new = '''Oui. Les frais de ménage et de linge de maison ne sont pas inclus dans le calcul de notre commission. Ils sont facturés séparément et ne sont donc pas soumis aux 19 %. Lors de la réservation, les frais de ménage sont directement facturés aux voyageurs.'''
          s = s.replace(old, new)
          if '18 %' in s or '18%' in s or '0.18' in s:
              raise SystemExit('Legacy 18 percent reference remains')
          if new not in s:
              raise SystemExit('FAQ wording was not updated')
          marker = '<!-- commission-rate-final-2026-09-14 -->'
          if marker not in s:
              s = s.replace('</body>', marker + '\n</body>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Set commission to 19 percent and update FAQ"
          git push
