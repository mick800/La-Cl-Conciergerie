name: Update commission rate

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-rate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set commission to 19 percent and clarify cleaning fees
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Replace all textual and calculator references.
          s = s.replace('18 %', '19 %')
          s = s.replace('18%', '19%')
          s = s.replace('18\u00a0%', '19 %')
          s = s.replace('0.18', '0.19')

          # FAQ: keep the answer simple and state separately how cleaning/linen fees work.
          faq_old = ('Oui. Selon la formule choisie, nous pouvons prendre en charge le nettoyage du logement après les séjours ainsi '
                     'que la préparation et la mise en place du linge.')
          faq_new = ('Oui. Les frais de ménage et de linge de maison ne sont pas inclus dans le calcul de notre commission. Ils sont '
                     'facturés séparément et ne sont donc pas soumis aux 19 %. Dans le cadre des locations courte durée, les frais de '
                     'ménage sont directement facturés aux voyageurs.')
          s = s.replace(faq_old, faq_new)

          # Also replace the FAQ wording if the previous automated version is already present.
          previous_faq = ('Oui. Selon la formule choisie, nous pouvons prendre en charge le nettoyage du logement après les séjours ainsi '
                          'que la préparation et la mise en place du linge. Les frais de ménage et de linge de maison ne sont pas inclus '
                          'dans le calcul de notre commission. Ils sont facturés séparément et ne sont donc pas soumis aux 19 %. '
                          'Dans le cadre des locations courte durée, les frais de ménage sont directement facturés aux voyageurs.')
          s = s.replace(previous_faq, faq_new)

          # Add a visible pricing note once, directly in the page.
          note = ('<p class="commission-note" style="margin-top:18px;font-size:13px;line-height:1.7;opacity:.72;">'
                  'Les frais de ménage et de linge de maison ne font pas partie de la base de calcul. '
                  'Ils sont facturés séparément et ne sont donc pas soumis aux 19 %.'</p>')
          if 'commission-note' not in s:
              marker = '</section>'
              pos = s.find('NOS TARIFS')
              if pos != -1:
                  end = s.find(marker, pos)
                  if end != -1:
                      s = s[:end] + note + '\n' + s[end:]

          # Safety net: make the browser display 19 % everywhere visible.
          browser_fix = r'''\n<script id="commission-rate-fix">\ndocument.addEventListener('DOMContentLoaded', function(){\n  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);\n  const nodes = [];\n  while (walker.nextNode()) nodes.push(walker.currentNode);\n  nodes.forEach(function(node){\n    if (/18\\s*%/.test(node.nodeValue)) node.nodeValue = node.nodeValue.replace(/18\\s*%/g, '19 %');\n  });\n});\n</script>\n'''
          if 'id="commission-rate-fix"' not in s:
              s = s.replace('</body>', browser_fix + '</body>')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes if needed
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Simplify cleaning and linen FAQ wording"
          git push
