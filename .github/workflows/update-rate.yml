name: Update commission rate

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-rate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update 18 percent to 19 percent
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('18 %', '19 %')
          s = s.replace('value="0.18"', 'value="0.19"')
          s = s.replace('const rate = 0.18;', 'const rate = 0.19;')
          s = s.replace('"0.18":"Prestige — 19 %"', '"0.19":"Prestige — 19 %"')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes if needed
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Pass commission rate from 18% to 19%"
          git push
