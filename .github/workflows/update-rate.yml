name: Update commission rate

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-rate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Force commission and FAQ to 19 percent
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # Commission rate: replace every legacy 18% representation.
          s = s.replace('18 %', '19 %')
          s = s.replace('18%', '19%')
          s = s.replace('18\u00a0%', '19 %')
          s = s.replace('18&nbsp;%', '19 %')
          s = s.replace('18&#160;%', '19 %')
          s = s.replace('0.18', '0.19')
          s = re.sub(r'const rate\s*=\s*0\.18', 'const rate = 0.19', s)

          # FAQ: exact wording requested.
          faq = '''Oui. Les frais de ménage et de linge de maison ne sont pas inclus dans le calcul de notre commission. Ils sont facturés séparément et ne sont donc pas soumis aux 19 %. Lors de la réservation, les frais de ménage sont directement facturés aux voyageurs.'''
          old_faq = '''Oui. Selon la formule choisie, nous pouvons prendre en charge
le nettoyage du logement après les séjours ainsi que la préparation
et la mise en place du linge.'''
          s = s.replace(old_faq, faq)
          s = re.sub(r'Oui\.\s*Selon la formule choisie,.*?mise en place du linge\.', faq, s, flags=re.S)

          # Keep calculator logic and labels consistent.
          s = s.replace('Gestion complète — 18 %', 'Gestion complète — 19 %')
          s = s.replace('formule Prestige à 18 %', 'formule Prestige à 19 %')
          s = s.replace('formule Prestige est proposée à 18 %', 'formule Prestige est proposée à 19 %')

          # Force a fresh HTML deployment marker on every run.
          marker = '<!-- commission-rate-deployment-2026-09-14-final -->'
          s = re.sub(r'<!-- commission-rate-deployment-[^>]+ -->', '', s)
          s = s.replace('</body>', marker + '\n</body>')

          p.write_text(s, encoding='utf-8')
          print('Changed:', s != original)
          print('Remaining 18 %:', s.count('18 %'))
          print('Remaining 18%:', s.count('18%'))
          print('Remaining 0.18:', s.count('0.18'))
          print('Exact FAQ present:', faq in s)
          PY

      - name: Commit changes if needed
        run: |
          git status --short
          if git diff --quiet -- index.html; then
            printf '\n<!-- commission-rate-deployment-fallback-final-2026-09-14 -->\n' >> index.html
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Force 19 percent commission and FAQ wording"
          git push
