name: Secure reviews site

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  secure-reviews:
    if: "!contains(github.event.head_commit.message, '[skip secure-reviews]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix review form message container
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'id="reviewMessage"' not in s:
              needle = '''<button\ntype="submit"\nclass="btn-gold review-submit"\nid="reviewSubmit"\n>\nEnvoyer mon avis\n</button>'''
              replacement = needle + '''\n\n<div id="reviewMessage" class="review-message" role="status" aria-live="polite"></div>'''
              if needle not in s:
                  raise SystemExit('Review submit button not found; no file changed.')
              s = s.replace(needle, replacement, 1)
              p.write_text(s, encoding='utf-8')
              print('Added reviewMessage container.')
          else:
              print('reviewMessage already present.')

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Fix review submission message [skip secure-reviews]'
            git push
          fi
