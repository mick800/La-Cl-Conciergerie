name: Update cookie banner wording

on:
  push:
    paths:
      - "static-pricing-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update cookie wording and footer preferences
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          old = "Nous utilisons des traceurs nécessaires au fonctionnement du site et, avec votre accord, Google Ads pour mesurer les conversions et améliorer nos campagnes. Vous pouvez accepter, refuser ou personnaliser votre choix. <a href=\"#\" id=\"lc-cookie-more\">En savoir plus</a>."
          new = "Les cookies ont pour but de faciliter la navigation, de détecter d'éventuels problèmes et de diffuser des offres commerciales personnalisées. Vous pouvez personnaliser votre consentement pour chaque cookie. <br><br>Pour modifier vos préférences par la suite, cliquez sur le lien 'Préférences de cookies' situé dans le pied de page."

          if old not in text:
              raise SystemExit("Cookie description not found")
          text = text.replace(old, new, 1)

          marker = "function openSettings(){"
          inject = """function addFooterCookiePreferences(){
              var footer=document.querySelector('footer');
              if(!footer || document.getElementById('lc-cookie-footer')) return;
              var wrap=footer.querySelector('.footer-links');
              if(!wrap){wrap=document.createElement('div');wrap.className='footer-links';footer.appendChild(wrap)}
              var btn=document.createElement('button');
              btn.type='button';
              btn.id='lc-cookie-footer';
              btn.textContent='Préférences de cookies';
              wrap.appendChild(btn);
              btn.addEventListener('click',openSettings);
            }

            """
          if marker not in text:
              raise SystemExit("Cookie settings function not found")
          text = text.replace(marker, inject + marker, 1)

          marker2 = "document.getElementById('lc-cookie-more').addEventListener('click',function(e){e.preventDefault();openSettings()});"
          if marker2 in text:
              text = text.replace(marker2, "", 1)
          else:
              print("Existing more-link listener not found; continuing")

          marker3 = "if(isValid(consent)){"
          if marker3 not in text:
              raise SystemExit("Cookie initialization not found")
          text = text.replace(marker3, "addFooterCookiePreferences();\n\n            " + marker3, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No changes needed" && exit 0
          git commit -m "Update cookie banner wording and preferences link"
          git push
